      NATS_MAX_ACK_PENDING: ${NATS_MAX_ACK_PENDING:?Set NATS_MAX_ACK_PENDING in root .env}
      NATS_ACK_WAIT: ${NATS_ACK_WAIT:?Set NATS_ACK_WAIT in root .env}
