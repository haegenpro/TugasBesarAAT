services:
  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    env_file:
      - ./broker/.env
    volumes:
      - ./broker/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/broker-ready && broker-init --check"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  broker-init:
    build:
      context: ./broker
      dockerfile: Dockerfile.init
    env_file:
      - ./broker/.env
    profiles:
      - tools
    networks: [backend]

  postgres:
    image: postgres:16-alpine3.24
    env_file:
      - ./store/.env
    volumes:
      - ./store/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [store]

  registry-db:
    image: postgres:16-alpine3.24
    env_file:
      - ./registry/.env
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [registry]

  schema-registry:
    build: ./registry
    env_file:
      - ./registry/.env
    depends_on:
      registry-db:
        condition: service_healthy
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, registry]

  bmkg-mock:
    build: ./bmkg-mock
    ports: ["8081:8081"]
    env_file:
      - ./bmkg-mock/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$BMKG_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  pvmbg-mock:
    build: ./pvmbg-mock
    ports: ["8082:8082"]
    env_file:
      - ./pvmbg-mock/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$PVMBG_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  aggregator:
    build: ./aggregator
    env_file:
      - ./aggregator/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$AGGREGATOR_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, store]

  auth-service:
    build: ./auth-service
    env_file:
      - ./auth-service/.env
    volumes:
      - auth-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$AUTH_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  client-api:
    build: ./client-api
    ports: ["8080:8080"]
    env_file:
      - ./client-api/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CLIENT_API_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, client]

  client-tui:
    build: ./client-tui
    profiles: [demo]
    stdin_open: true
    tty: true
    env_file:
      - ./client-tui/.env
    networks: [client]

  consumer-dashboard:
    build: ./consumer-dashboard
    env_file:
      - ./consumer-dashboard/.env
    volumes:
      - dashboard-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CONSUMER_PORT/ready\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  consumer-notifier:
    build: ./consumer-notifier
    env_file:
      - ./consumer-notifier/.env
    volumes:
      - notifier-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CONSUMER_PORT/ready\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  consumer-dashboard-demo:
    build: ./consumer-dashboard
    profiles: [consumer-demo]
    env_file:
      - ./consumer-dashboard/.env
    environment:
      NATS_DURABLE: dashboard-demo-v1
      CONSUMER_PORT: "8093"
      CONSUMER_DB_PATH: /data/demo.db
      NATS_DLQ_SUBJECT: hazard.dlq.dashboard-demo
    volumes:
      - dashboard-demo-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8093/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  nats-data:
  postgres-data:
  auth-data:
  registry-data:
  dashboard-data:
  notifier-data:
  dashboard-demo-data:

networks:
  backend:
  store:
  client:
  registry:
