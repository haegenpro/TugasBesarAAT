      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - backend
    - dashboard-demo-store
    tmpfs:
    - /data:uid=10001,gid=10001,mode=0700
    stop_grace_period: 40s
  nats-exporter:
    profiles:
    - monitoring
    build:
      context: ./monitoring
      target: nats-exporter
    environment:
      NATS_EXPORTER_PORT: ${NATS_EXPORTER_PORT:?Set NATS_EXPORTER_PORT in root .env or the shell}
      NATS_MONITOR_URL: http://broker:${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}
    healthcheck:
      test:
      - CMD
      - monitoring-launch
      - probe
      - http://localhost:${NATS_EXPORTER_PORT:?Set NATS_EXPORTER_PORT in root .env or the shell}/metrics
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
    - backend
    - monitoring
  grafana:
    profiles:
    - monitoring
    build:
      context: ./monitoring
      target: grafana
    env_file:
    - ./monitoring/grafana/.env
    environment:
      GRAFANA_PORT: ${GRAFANA_PORT:?Set GRAFANA_PORT in root .env or the shell}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:?Set GRAFANA_PORT in root .env or the shell}
      PROMETHEUS_URL: http://prometheus:${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}
      LOKI_URL: http://loki:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}
      GRAFANA_BIND_ADDRESS: ${GRAFANA_BIND_ADDRESS:?Set GRAFANA_BIND_ADDRESS in root .env or the shell}
      GRAFANA_HOST_PORT: ${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in root .env or the shell}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      TEMPO_URL: http://tempo:${TEMPO_PORT:?Set TEMPO_PORT in root .env}
    ports:
    - ${GRAFANA_BIND_ADDRESS:?Set GRAFANA_BIND_ADDRESS in root .env or the shell}:${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in root .env or the shell}:${GRAFANA_PORT:?Set
      GRAFANA_PORT in root .env or the shell}
    volumes:
    - ./monitoring/templates:/etc/monitoring/templates:ro
    - grafana-data:/var/lib/grafana
    healthcheck:
      test:
      - CMD
      - monitoring-launch
      - probe
      - http://localhost:${GRAFANA_PORT:?Set GRAFANA_PORT in root .env or the shell}/api/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
    - monitoring
  prometheus:
    profiles:
    - monitoring
    build:
      context: ./monitoring
      target: prometheus
    env_file:
    - ./monitoring/prometheus/.env
    volumes:
    - ./monitoring/templates:/etc/monitoring/templates:ro
    - prometheus-data:/prometheus
    environment:
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}
      ALLOY_METRICS_URL: http://alloy:${ALLOY_PORT:?Set ALLOY_PORT in root .env or the shell}/metrics
      LOKI_METRICS_URL: http://loki:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}/metrics
      NATS_EXPORTER_METRICS_URL: http://nats-exporter:${NATS_EXPORTER_PORT:?Set NATS_EXPORTER_PORT in root .env or the shell}/metrics
      BMKG_PORT: ${BMKG_PORT:?Set BMKG_PORT in root .env}
      PVMBG_PORT: ${PVMBG_PORT:?Set PVMBG_PORT in root .env}
      AGGREGATOR_PORT: ${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env}
      AUTH_PORT: ${AUTH_PORT:?Set AUTH_PORT in root .env}
      CLIENT_API_PORT: ${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env}
      DASHBOARD_PORT: ${DASHBOARD_PORT:?Set DASHBOARD_PORT in root .env}
      NOTIFIER_PORT: ${NOTIFIER_PORT:?Set NOTIFIER_PORT in root .env}
    healthcheck:
      test:
      - CMD
      - monitoring-launch
      - probe
      - http://localhost:${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}/-/ready
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
    - monitoring
    - backend
  loki:
    profiles:
    - monitoring
    build:
      context: ./monitoring
      target: loki
    env_file:
    - ./monitoring/loki/.env
    volumes:
    - ./monitoring/templates:/etc/monitoring/templates:ro
    - loki-data:/loki
    environment:
      LOKI_PORT: ${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}
    healthcheck:
      test:
      - CMD
      - monitoring-launch
      - probe
      - http://localhost:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}/ready
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
    - monitoring
  alloy:
    profiles:
    - monitoring
    build:
      context: ./monitoring
      target: alloy
    environment:
      ALLOY_PORT: ${ALLOY_PORT:?Set ALLOY_PORT in root .env or the shell}
      PROMETHEUS_WRITE_URL: http://prometheus:${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}/api/v1/write
      LOKI_PUSH_URL: http://loki:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}/loki/api/v1/push
      BMKG_HEALTH_URL: http://bmkg-mock:${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}/health
      PVMBG_HEALTH_URL: http://pvmbg-mock:${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}/health
      AGGREGATOR_HEALTH_URL: http://aggregator:${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}/health
      AGGREGATOR_READY_URL: http://aggregator:${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}/ready
      AUTH_HEALTH_URL: http://auth-service:${AUTH_PORT:?Set AUTH_PORT in root .env or the shell}/health
      CLIENT_API_HEALTH_URL: http://client-api:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}/health
      CLIENT_API_READY_URL: http://client-api:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}/ready
      DASHBOARD_HEALTH_URL: http://consumer-dashboard:${DASHBOARD_PORT:?Set DASHBOARD_PORT in root .env or the shell}/health
      DASHBOARD_READY_URL: http://consumer-dashboard:${DASHBOARD_PORT:?Set DASHBOARD_PORT in root .env or the shell}/ready
      NOTIFIER_HEALTH_URL: http://consumer-notifier:${NOTIFIER_PORT:?Set NOTIFIER_PORT in root .env or the shell}/health
      NOTIFIER_READY_URL: http://consumer-notifier:${NOTIFIER_PORT:?Set NOTIFIER_PORT in root .env or the shell}/ready
      REGISTRY_READY_URL: http://schema-registry:${SCHEMA_REGISTRY_MANAGEMENT_PORT:?Set SCHEMA_REGISTRY_MANAGEMENT_PORT in root .env or the shell}/health/ready
      NATS_HEALTH_URL: http://broker:${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}/healthz
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?Compose project name must be resolved}
    volumes:
    - ./monitoring/templates:/etc/monitoring/templates:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - alloy-data:/var/lib/alloy/data
    healthcheck:
      test:
      - CMD
      - monitoring-launch
      - probe
      - http://localhost:${ALLOY_PORT:?Set ALLOY_PORT in root .env or the shell}/-/ready
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
    - monitoring
    - backend
  auth-db:
    image: postgres:16-alpine3.24
    command:
    - postgres
    - -p
    - ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env}
    env_file:
    - ./auth-db/.env
    volumes:
    - auth-data:/var/lib/postgresql/data
    - ./deployment/postgres/00-runtime-role.sh:/docker-entrypoint-initdb.d/00-runtime-role.sh:ro
    - ./auth-service/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - ./deployment/postgres/99-runtime-grants.sh:/docker-entrypoint-initdb.d/99-runtime-grants.sh:ro
    environment:
      PGPORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - auth-store
  dashboard-db:
    image: postgres:16-alpine3.24
    command: &id001
    - postgres
    - -p
    - ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env}
    env_file:
    - ./dashboard-db/.env
    volumes:
    - dashboard-data:/var/lib/postgresql/data
    - ./deployment/postgres/00-runtime-role.sh:/docker-entrypoint-initdb.d/00-runtime-role.sh:ro
    - ./consumer-dashboard/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - ./deployment/postgres/99-runtime-grants.sh:/docker-entrypoint-initdb.d/99-runtime-grants.sh:ro
    environment: &id002
      PGPORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env}
    healthcheck: &id003
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - dashboard-store
  notifier-db:
    image: postgres:16-alpine3.24
    command:
    - postgres
    - -p
    - ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env}
    env_file:
    - ./notifier-db/.env
    volumes:
    - notifier-data:/var/lib/postgresql/data
    - ./deployment/postgres/00-runtime-role.sh:/docker-entrypoint-initdb.d/00-runtime-role.sh:ro
    - ./consumer-notifier/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - ./deployment/postgres/99-runtime-grants.sh:/docker-entrypoint-initdb.d/99-runtime-grants.sh:ro
    environment:
      PGPORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - notifier-store
  dashboard-demo-db:
    image: postgres:16-alpine3.24
    command: *id001
    env_file:
    - ./dashboard-demo-db/.env
    volumes:
    - dashboard-demo-data:/var/lib/postgresql/data
    - ./deployment/postgres/00-runtime-role.sh:/docker-entrypoint-initdb.d/00-runtime-role.sh:ro
    - ./consumer-dashboard/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - ./deployment/postgres/99-runtime-grants.sh:/docker-entrypoint-initdb.d/99-runtime-grants.sh:ro
    environment: *id002
    healthcheck: *id003
    networks:
    - dashboard-demo-store
    profiles:
    - consumer-demo
  tempo:
    profiles:
    - monitoring
    image: grafana/tempo:2.9.0
    command:
    - -config.file=/etc/tempo.yml
    - -config.expand-env=true
    environment:
      TEMPO_PORT: ${TEMPO_PORT:?Set TEMPO_PORT in root .env}
      OTLP_HTTP_PORT: ${OTLP_HTTP_PORT:?Set OTLP_HTTP_PORT in root .env}
      OTLP_GRPC_PORT: ${OTLP_GRPC_PORT:?Set OTLP_GRPC_PORT in root .env}
    volumes:
    - ./monitoring/tempo.yml:/etc/tempo.yml:ro
    - tempo-data:/var/tempo
    networks:
    - backend
    - monitoring
