services:
  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    env_file:
      - ./broker/.env
    volumes:
      - ./broker/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "${NATS_HOST_PORT:?Set NATS_HOST_PORT in root .env or the shell}:4222"
      - "${NATS_MONITOR_HOST_PORT:?Set NATS_MONITOR_HOST_PORT in root .env or the shell}:8222"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/broker-ready && broker-init --check"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  broker-init:
    build:
      context: ./broker
      dockerfile: Dockerfile.init
    env_file:
      - ./broker/.env
    profiles:
      - tools
    networks: [backend]

  postgres:
    image: postgres:16-alpine3.24
    env_file:
      - ./store/.env
    volumes:
      - ./store/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [store]

  registry-db:
    image: postgres:16-alpine3.24
    env_file:
      - ./registry/.env
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [registry]

  schema-registry:
    build: ./registry
    env_file:
      - ./registry/.env
    ports:
      - "${SCHEMA_REGISTRY_HOST_PORT:?Set SCHEMA_REGISTRY_HOST_PORT in root .env or the shell}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, registry]

  bmkg-mock:
    build: ./bmkg-mock
    volumes: [bmkg-history:/data]
    ports: ["${BMKG_HOST_PORT:?Set BMKG_HOST_PORT in root .env or the shell}:8081"]
    env_file:
      - ./bmkg-mock/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$BMKG_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  pvmbg-mock:
    build: ./pvmbg-mock
    volumes: [pvmbg-history:/data]
    ports: ["${PVMBG_HOST_PORT:?Set PVMBG_HOST_PORT in root .env or the shell}:8082"]
    env_file:
      - ./pvmbg-mock/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$PVMBG_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  aggregator:
    build: ./aggregator
    env_file:
      - ./aggregator/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$AGGREGATOR_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, store]

  auth-service:
    build: ./auth-service
    env_file:
      - ./auth-service/.env
    volumes:
      - auth-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$AUTH_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  client-api:
    build: ./client-api
    ports: ["${CLIENT_API_HOST_PORT:?Set CLIENT_API_HOST_PORT in root .env or the shell}:8080"]
    env_file:
      - ./client-api/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CLIENT_API_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, client]

  client-tui:
    build: ./client-tui
    profiles: [demo]
    stdin_open: true
    tty: true
    env_file:
      - ./client-tui/.env
    networks: [client]

  consumer-dashboard:
    build: ./consumer-dashboard
    env_file:
      - ./consumer-dashboard/.env
    volumes:
      - dashboard-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CONSUMER_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  consumer-notifier:
    build: ./consumer-notifier
    env_file:
      - ./consumer-notifier/.env
    volumes:
      - notifier-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CONSUMER_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  consumer-dashboard-demo:
    build: ./consumer-dashboard
    profiles: [consumer-demo]
    env_file:
      - ./consumer-dashboard/.env
    environment:
      NATS_DURABLE: dashboard-demo-v1
      CONSUMER_PORT: "8093"
      CONSUMER_DB_PATH: /data/demo.db
      NATS_DLQ_SUBJECT: hazard.dlq.dashboard-demo
    volumes:
      - dashboard-demo-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8093/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  nats-exporter:
    build:
      context: ./monitoring
      target: nats-exporter
    env_file: [./monitoring/nats-exporter/.env]
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:7777/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [backend, monitoring]

  grafana:
    build:
      context: ./monitoring
      target: grafana
    env_file: [./monitoring/grafana/.env]
    environment:
      GRAFANA_BIND_ADDRESS: "${GRAFANA_BIND_ADDRESS:?Set GRAFANA_BIND_ADDRESS in root .env or the shell}"
      GRAFANA_HOST_PORT: "${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in root .env or the shell}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${GRAFANA_BIND_ADDRESS:?Set GRAFANA_BIND_ADDRESS in root .env or the shell}:${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in root .env or the shell}:3000"
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [monitoring]

  prometheus:
    build:
      context: ./monitoring
      target: prometheus
    env_file: [./monitoring/prometheus/.env]
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [monitoring]

  loki:
    build:
      context: ./monitoring
      target: loki
    env_file: [./monitoring/loki/.env]
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [monitoring]

  alloy:
    build:
      context: ./monitoring
      target: alloy
    env_file: [./monitoring/alloy/.env]
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:?Compose project name must be resolved}"
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:12345/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [monitoring, backend]

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
  bmkg-history:
  pvmbg-history:
  nats-data:
  postgres-data:
  auth-data:
  registry-data:
  dashboard-data:
  notifier-data:
  dashboard-demo-data:

networks:
  backend:
  store:
  client:
  registry:
  monitoring:
