  consumer-dashboard-demo:
    build: ./consumer-dashboard
    profiles:
    - consumer-demo
    env_file:
    - ./consumer-dashboard-demo/.env
    environment:
      CONSUMER_PORT: ${DEMO_CONSUMER_PORT:?Set DEMO_CONSUMER_PORT in root .env or the shell}
      NATS_URL: nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}
      SCHEMA_REGISTRY_URL: http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7
      NATS_DURABLE: dashboard-demo-v1
      NATS_DLQ_SUBJECT: hazard.dlq.dashboard-demo
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:?Set DB_MAX_OPEN_CONNS in root .env}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:?Set DB_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS: ${HTTP_MAX_IDLE_CONNS:?Set HTTP_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS_PER_HOST: ${HTTP_MAX_IDLE_CONNS_PER_HOST:?Set HTTP_MAX_IDLE_CONNS_PER_HOST in root .env}
      HTTP_MAX_CONNS_PER_HOST: ${HTTP_MAX_CONNS_PER_HOST:?Set HTTP_MAX_CONNS_PER_HOST in root .env}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:?Set MAX_PAYLOAD_BYTES in root .env}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:?Set MAX_JSON_DEPTH in root .env}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in root .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:${OTLP_HTTP_PORT:?Set OTLP_HTTP_PORT in root .env}
