services:
  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    env_file:
      - ./broker/.env
    volumes:
      - ./broker/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    # No host ports: downstream clients access data through Client API only.
    # Operators run broker tools with docker compose exec; no host mapping needed.
    environment:
      NATS_PORT: "${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
      NATS_MONITOR_PORT: "${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}"
      NATS_URL: "nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/broker-ready && broker-init --check"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  broker-init:
    build:
      context: ./broker
      dockerfile: Dockerfile.init
    env_file:
      - ./broker/.env
    profiles:
      - tools
    environment:
      NATS_PORT: "${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
      NATS_MONITOR_PORT: "${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}"
      NATS_URL: "nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
    networks: [backend]

  postgres:
    command: ["postgres", "-p", "${POSTGRES_PORT:?Set POSTGRES_PORT in root .env or the shell}"]
    image: postgres:16-alpine3.24
    env_file:
      - ./store/.env
    volumes:
      - ./store/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    environment:
      PGPORT: "${POSTGRES_PORT:?Set POSTGRES_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [store]

  registry-db:
    command: ["postgres", "-p", "${REGISTRY_DB_PORT:?Set REGISTRY_DB_PORT in root .env or the shell}"]
    image: postgres:16-alpine3.24
    env_file:
      - ./registry/.env
    volumes:
      - registry-data:/var/lib/postgresql/data
    environment:
      PGPORT: "${REGISTRY_DB_PORT:?Set REGISTRY_DB_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [registry]

  schema-registry:
    build: ./registry
    env_file:
      - ./registry/.env
    # Schema writes are trusted backend operations; no public registry port.
    environment:
      QUARKUS_HTTP_PORT: "${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}"
      QUARKUS_MANAGEMENT_PORT: "${SCHEMA_REGISTRY_MANAGEMENT_PORT:?Set SCHEMA_REGISTRY_MANAGEMENT_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:${SCHEMA_REGISTRY_MANAGEMENT_PORT:?Set SCHEMA_REGISTRY_MANAGEMENT_PORT in root .env or the shell}/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, registry]

  bmkg-mock:
    build: ./bmkg-mock
    volumes: [bmkg-history:/data]
    ports: ["${BMKG_HOST_PORT:?Set BMKG_HOST_PORT in root .env or the shell}:${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}"]
    env_file:
      - ./bmkg-mock/.env
    environment:
      BMKG_PORT: "${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$BMKG_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  pvmbg-mock:
    build: ./pvmbg-mock
    volumes: [pvmbg-history:/data]
    ports: ["${PVMBG_HOST_PORT:?Set PVMBG_HOST_PORT in root .env or the shell}:${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}"]
    env_file:
      - ./pvmbg-mock/.env
    environment:
      PVMBG_PORT: "${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$PVMBG_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  aggregator:
    build: ./aggregator
    env_file:
      - ./aggregator/.env
    environment:
      AGGREGATOR_PORT: "${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}"
      BMKG_BASE_URL: "http://bmkg-mock:${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}"
      PVMBG_BASE_URL: "http://pvmbg-mock:${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}"
      NATS_URL: "nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$AGGREGATOR_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, store]

  auth-service:
    build: ./auth-service
    env_file:
      - ./auth-service/.env
    volumes:
      - auth-data:/data
    environment:
      AUTH_PORT: "${AUTH_PORT:?Set AUTH_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$AUTH_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  client-api:
    build: ./client-api
    ports: ["${CLIENT_API_HOST_PORT:?Set CLIENT_API_HOST_PORT in root .env or the shell}:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}"]
    env_file:
      - ./client-api/.env
    environment:
      CLIENT_API_PORT: "${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}"
      AUTH_BASE_URL: "http://auth-service:${AUTH_PORT:?Set AUTH_PORT in root .env or the shell}"
      AGGREGATOR_BASE_URL: "http://aggregator:${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CLIENT_API_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend, client]

  client-tui:
    build: ./client-tui
    profiles: [demo]
    stdin_open: true
    tty: true
    env_file:
      - ./client-tui/.env
    environment:
      BNPB_API_URL: "http://client-api:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}"
    networks: [client]

  consumer-dashboard:
    build: ./consumer-dashboard
    env_file:
      - ./consumer-dashboard/.env
    volumes:
      - dashboard-data:/data
    environment:
      CONSUMER_PORT: "${DASHBOARD_PORT:?Set DASHBOARD_PORT in root .env or the shell}"
      NATS_URL: "nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CONSUMER_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  consumer-notifier:
    build: ./consumer-notifier
    env_file:
      - ./consumer-notifier/.env
    volumes:
      - notifier-data:/data
    environment:
      CONSUMER_PORT: "${NOTIFIER_PORT:?Set NOTIFIER_PORT in root .env or the shell}"
      NATS_URL: "nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://localhost:$$CONSUMER_PORT/health\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  consumer-dashboard-demo:
    build: ./consumer-dashboard
    profiles: [consumer-demo]
    env_file:
      - ./consumer-dashboard/.env
    environment:
      CONSUMER_PORT: "${DEMO_CONSUMER_PORT:?Set DEMO_CONSUMER_PORT in root .env or the shell}"
      NATS_URL: "nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}"
      SCHEMA_REGISTRY_URL: "http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7"
      NATS_DURABLE: dashboard-demo-v1
      CONSUMER_DB_PATH: /data/demo.db
      NATS_DLQ_SUBJECT: hazard.dlq.dashboard-demo
    volumes:
      - dashboard-demo-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$$CONSUMER_PORT/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  nats-exporter:
    build:
      context: ./monitoring
      target: nats-exporter
    environment:
      NATS_EXPORTER_PORT: "${NATS_EXPORTER_PORT:?Set NATS_EXPORTER_PORT in root .env or the shell}"
      NATS_MONITOR_URL: "http://broker:${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:${NATS_EXPORTER_PORT:?Set NATS_EXPORTER_PORT in root .env or the shell}/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [backend, monitoring]

  grafana:
    build:
      context: ./monitoring
      target: grafana
    env_file: [./monitoring/grafana/.env]
    environment:
      GRAFANA_PORT: "${GRAFANA_PORT:?Set GRAFANA_PORT in root .env or the shell}"
      GF_SERVER_HTTP_PORT: "${GRAFANA_PORT:?Set GRAFANA_PORT in root .env or the shell}"
      PROMETHEUS_URL: "http://prometheus:${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}"
      LOKI_URL: "http://loki:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}"
      GRAFANA_BIND_ADDRESS: "${GRAFANA_BIND_ADDRESS:?Set GRAFANA_BIND_ADDRESS in root .env or the shell}"
      GRAFANA_HOST_PORT: "${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in root .env or the shell}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${GRAFANA_BIND_ADDRESS:?Set GRAFANA_BIND_ADDRESS in root .env or the shell}:${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in root .env or the shell}:${GRAFANA_PORT:?Set GRAFANA_PORT in root .env or the shell}"
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:${GRAFANA_PORT:?Set GRAFANA_PORT in root .env or the shell}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [monitoring]

  prometheus:
    build:
      context: ./monitoring
      target: prometheus
    env_file: [./monitoring/prometheus/.env]
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - prometheus-data:/prometheus
    environment:
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}"
      ALLOY_METRICS_URL: "http://alloy:${ALLOY_PORT:?Set ALLOY_PORT in root .env or the shell}/metrics"
      LOKI_METRICS_URL: "http://loki:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}/metrics"
      NATS_EXPORTER_METRICS_URL: "http://nats-exporter:${NATS_EXPORTER_PORT:?Set NATS_EXPORTER_PORT in root .env or the shell}/metrics"
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [monitoring]

  loki:
    build:
      context: ./monitoring
      target: loki
    env_file: [./monitoring/loki/.env]
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - loki-data:/loki
    environment:
      LOKI_PORT: "${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}"
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [monitoring]

  alloy:
    build:
      context: ./monitoring
      target: alloy
    environment:
      ALLOY_PORT: "${ALLOY_PORT:?Set ALLOY_PORT in root .env or the shell}"
      PROMETHEUS_WRITE_URL: "http://prometheus:${PROMETHEUS_PORT:?Set PROMETHEUS_PORT in root .env or the shell}/api/v1/write"
      LOKI_PUSH_URL: "http://loki:${LOKI_PORT:?Set LOKI_PORT in root .env or the shell}/loki/api/v1/push"
      BMKG_HEALTH_URL: "http://bmkg-mock:${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}/health"
      PVMBG_HEALTH_URL: "http://pvmbg-mock:${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}/health"
      AGGREGATOR_HEALTH_URL: "http://aggregator:${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}/health"
      AGGREGATOR_READY_URL: "http://aggregator:${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}/ready"
      AUTH_HEALTH_URL: "http://auth-service:${AUTH_PORT:?Set AUTH_PORT in root .env or the shell}/health"
      CLIENT_API_HEALTH_URL: "http://client-api:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}/health"
      CLIENT_API_READY_URL: "http://client-api:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}/ready"
      DASHBOARD_HEALTH_URL: "http://consumer-dashboard:${DASHBOARD_PORT:?Set DASHBOARD_PORT in root .env or the shell}/health"
      DASHBOARD_READY_URL: "http://consumer-dashboard:${DASHBOARD_PORT:?Set DASHBOARD_PORT in root .env or the shell}/ready"
      NOTIFIER_HEALTH_URL: "http://consumer-notifier:${NOTIFIER_PORT:?Set NOTIFIER_PORT in root .env or the shell}/health"
      NOTIFIER_READY_URL: "http://consumer-notifier:${NOTIFIER_PORT:?Set NOTIFIER_PORT in root .env or the shell}/ready"
      REGISTRY_READY_URL: "http://schema-registry:${SCHEMA_REGISTRY_MANAGEMENT_PORT:?Set SCHEMA_REGISTRY_MANAGEMENT_PORT in root .env or the shell}/health/ready"
      NATS_HEALTH_URL: "http://broker:${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}/healthz"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:?Compose project name must be resolved}"
    volumes:
      - ./monitoring/templates:/etc/monitoring/templates:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test: ["CMD", "monitoring-launch", "probe", "http://localhost:${ALLOY_PORT:?Set ALLOY_PORT in root .env or the shell}/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [monitoring, backend]

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
  bmkg-history:
  pvmbg-history:
  nats-data:
  postgres-data:
  auth-data:
  registry-data:
  dashboard-data:
  notifier-data:
  dashboard-demo-data:

networks:
  backend:
  store:
  client:
  registry:
  monitoring:
