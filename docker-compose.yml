      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - backend
    - auth-store
    stop_grace_period: 40s
  client-api:
    build: ./client-api
    ports:
    - ${CLIENT_API_HOST_PORT:?Set CLIENT_API_HOST_PORT in root .env or the shell}:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}
    env_file:
    - ./client-api/.env
    environment:
      CLIENT_API_PORT: ${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}
      AUTH_BASE_URL: http://auth-service:${AUTH_PORT:?Set AUTH_PORT in root .env or the shell}
      AGGREGATOR_BASE_URL: http://aggregator:${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:?Set DB_MAX_OPEN_CONNS in root .env}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:?Set DB_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS: ${HTTP_MAX_IDLE_CONNS:?Set HTTP_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS_PER_HOST: ${HTTP_MAX_IDLE_CONNS_PER_HOST:?Set HTTP_MAX_IDLE_CONNS_PER_HOST in root .env}
      HTTP_MAX_CONNS_PER_HOST: ${HTTP_MAX_CONNS_PER_HOST:?Set HTTP_MAX_CONNS_PER_HOST in root .env}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:?Set MAX_PAYLOAD_BYTES in root .env}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:?Set MAX_JSON_DEPTH in root .env}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in root .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:${OTLP_HTTP_PORT:?Set OTLP_HTTP_PORT in root .env}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:?Set DB_STATEMENT_TIMEOUT in root .env}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:?Set DB_LOCK_TIMEOUT in root .env}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider "http://localhost:$$CLIENT_API_PORT/health"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - backend
    - client
    stop_grace_period: 40s
  client-tui:
    build: ./client-tui
    profiles:
    - demo
    stdin_open: true
    tty: true
    env_file:
    - ./client-tui/.env
    environment:
      BNPB_API_URL: http://client-api:${CLIENT_API_PORT:?Set CLIENT_API_PORT in root .env or the shell}
    networks:
    - client
  consumer-dashboard:
    build: ./consumer-dashboard
    env_file:
    - ./consumer-dashboard/.env
    environment:
      CONSUMER_PORT: ${DASHBOARD_PORT:?Set DASHBOARD_PORT in root .env or the shell}
      NATS_URL: nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}
      SCHEMA_REGISTRY_URL: http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:?Set DB_MAX_OPEN_CONNS in root .env}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:?Set DB_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS: ${HTTP_MAX_IDLE_CONNS:?Set HTTP_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS_PER_HOST: ${HTTP_MAX_IDLE_CONNS_PER_HOST:?Set HTTP_MAX_IDLE_CONNS_PER_HOST in root .env}
      HTTP_MAX_CONNS_PER_HOST: ${HTTP_MAX_CONNS_PER_HOST:?Set HTTP_MAX_CONNS_PER_HOST in root .env}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:?Set MAX_PAYLOAD_BYTES in root .env}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:?Set MAX_JSON_DEPTH in root .env}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in root .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:${OTLP_HTTP_PORT:?Set OTLP_HTTP_PORT in root .env}
      CONSUMER_WORKERS: ${CONSUMER_WORKERS:?Set CONSUMER_WORKERS in root .env}
      NATS_MAX_ACK_PENDING: ${NATS_MAX_ACK_PENDING:?Set NATS_MAX_ACK_PENDING in root .env}
      NATS_ACK_WAIT: ${NATS_ACK_WAIT:?Set NATS_ACK_WAIT in root .env}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:?Set DB_STATEMENT_TIMEOUT in root .env}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:?Set DB_LOCK_TIMEOUT in root .env}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider "http://localhost:$$CONSUMER_PORT/health"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - backend
    - dashboard-store
    tmpfs:
    - /data:uid=10001,gid=10001,mode=0700
    stop_grace_period: 40s
  consumer-notifier:
    build: ./consumer-notifier
    env_file:
    - ./consumer-notifier/.env
    environment:
      CONSUMER_PORT: ${NOTIFIER_PORT:?Set NOTIFIER_PORT in root .env or the shell}
      NATS_URL: nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}
