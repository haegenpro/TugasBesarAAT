services:
  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    env_file:
    - ./broker/.env
    volumes:
    - ./broker/nats.conf:/etc/nats/nats.conf:ro
    - nats-data:/data
    environment:
      NATS_PORT: ${NATS_PORT:?Set NATS_PORT in root .env or the shell}
      NATS_MONITOR_PORT: ${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}
      NATS_URL: nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/broker-ready && broker-init --check
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
    - backend
  broker-init:
    build:
      context: ./broker
      dockerfile: Dockerfile.init
    env_file:
    - ./broker/.env
    profiles:
    - tools
    environment:
      NATS_PORT: ${NATS_PORT:?Set NATS_PORT in root .env or the shell}
      NATS_MONITOR_PORT: ${NATS_MONITOR_PORT:?Set NATS_MONITOR_PORT in root .env or the shell}
      NATS_URL: nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}
    networks:
    - backend
  postgres:
    command:
    - postgres
    - -p
    - ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env or the shell}
    image: postgres:16-alpine3.24
    env_file:
    - ./store/.env
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./deployment/postgres/00-runtime-role.sh:/docker-entrypoint-initdb.d/00-runtime-role.sh:ro
    - ./store/init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    - ./deployment/postgres/99-runtime-grants.sh:/docker-entrypoint-initdb.d/99-runtime-grants.sh:ro
    environment:
      PGPORT: ${POSTGRES_PORT:?Set POSTGRES_PORT in root .env or the shell}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - store
  registry-db:
    command:
    - postgres
    - -p
    - ${REGISTRY_DB_PORT:?Set REGISTRY_DB_PORT in root .env or the shell}
    image: postgres:16-alpine3.24
    env_file:
    - ./registry/.env
    volumes:
    - registry-data:/var/lib/postgresql/data
    environment:
      PGPORT: ${REGISTRY_DB_PORT:?Set REGISTRY_DB_PORT in root .env or the shell}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - registry
  schema-registry:
    build: ./registry
    env_file:
    - ./registry/.env
    environment:
      QUARKUS_HTTP_PORT: ${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}
      QUARKUS_MANAGEMENT_PORT: ${SCHEMA_REGISTRY_MANAGEMENT_PORT:?Set SCHEMA_REGISTRY_MANAGEMENT_PORT in root .env or the shell}
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://localhost:${SCHEMA_REGISTRY_MANAGEMENT_PORT:?Set SCHEMA_REGISTRY_MANAGEMENT_PORT in root .env or the shell}/health/ready
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - backend
    - registry
  bmkg-mock:
    build: ./bmkg-mock
    volumes:
    - bmkg-history:/data
    ports:
    - ${BMKG_HOST_PORT:?Set BMKG_HOST_PORT in root .env or the shell}:${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}
    env_file:
    - ./bmkg-mock/.env
    environment:
      BMKG_PORT: ${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}
      SCHEMA_REGISTRY_URL: http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:?Set DB_MAX_OPEN_CONNS in root .env}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:?Set DB_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS: ${HTTP_MAX_IDLE_CONNS:?Set HTTP_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS_PER_HOST: ${HTTP_MAX_IDLE_CONNS_PER_HOST:?Set HTTP_MAX_IDLE_CONNS_PER_HOST in root .env}
      HTTP_MAX_CONNS_PER_HOST: ${HTTP_MAX_CONNS_PER_HOST:?Set HTTP_MAX_CONNS_PER_HOST in root .env}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:?Set MAX_PAYLOAD_BYTES in root .env}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:?Set MAX_JSON_DEPTH in root .env}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in root .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:${OTLP_HTTP_PORT:?Set OTLP_HTTP_PORT in root .env}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:?Set DB_STATEMENT_TIMEOUT in root .env}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:?Set DB_LOCK_TIMEOUT in root .env}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider "http://localhost:$$BMKG_PORT/health"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - backend
    stop_grace_period: 40s
  pvmbg-mock:
    build: ./pvmbg-mock
    volumes:
    - pvmbg-history:/data
    ports:
    - ${PVMBG_HOST_PORT:?Set PVMBG_HOST_PORT in root .env or the shell}:${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}
    env_file:
    - ./pvmbg-mock/.env
    environment:
      PVMBG_PORT: ${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}
      SCHEMA_REGISTRY_URL: http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:?Set DB_MAX_OPEN_CONNS in root .env}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:?Set DB_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS: ${HTTP_MAX_IDLE_CONNS:?Set HTTP_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS_PER_HOST: ${HTTP_MAX_IDLE_CONNS_PER_HOST:?Set HTTP_MAX_IDLE_CONNS_PER_HOST in root .env}
      HTTP_MAX_CONNS_PER_HOST: ${HTTP_MAX_CONNS_PER_HOST:?Set HTTP_MAX_CONNS_PER_HOST in root .env}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:?Set MAX_PAYLOAD_BYTES in root .env}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:?Set MAX_JSON_DEPTH in root .env}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in root .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:${OTLP_HTTP_PORT:?Set OTLP_HTTP_PORT in root .env}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:?Set DB_STATEMENT_TIMEOUT in root .env}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:?Set DB_LOCK_TIMEOUT in root .env}
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider "http://localhost:$$PVMBG_PORT/health"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
    - backend
    stop_grace_period: 40s
  aggregator:
    build: ./aggregator
    env_file:
    - ./aggregator/.env
    environment:
      AGGREGATOR_PORT: ${AGGREGATOR_PORT:?Set AGGREGATOR_PORT in root .env or the shell}
      BMKG_BASE_URL: http://bmkg-mock:${BMKG_PORT:?Set BMKG_PORT in root .env or the shell}
      PVMBG_BASE_URL: http://pvmbg-mock:${PVMBG_PORT:?Set PVMBG_PORT in root .env or the shell}
      NATS_URL: nats://broker:${NATS_PORT:?Set NATS_PORT in root .env or the shell}
      SCHEMA_REGISTRY_URL: http://schema-registry:${SCHEMA_REGISTRY_PORT:?Set SCHEMA_REGISTRY_PORT in root .env or the shell}/apis/ccompat/v7
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:?Set DB_MAX_OPEN_CONNS in root .env}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:?Set DB_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS: ${HTTP_MAX_IDLE_CONNS:?Set HTTP_MAX_IDLE_CONNS in root .env}
      HTTP_MAX_IDLE_CONNS_PER_HOST: ${HTTP_MAX_IDLE_CONNS_PER_HOST:?Set HTTP_MAX_IDLE_CONNS_PER_HOST in root .env}
      HTTP_MAX_CONNS_PER_HOST: ${HTTP_MAX_CONNS_PER_HOST:?Set HTTP_MAX_CONNS_PER_HOST in root .env}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:?Set MAX_PAYLOAD_BYTES in root .env}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:?Set MAX_JSON_DEPTH in root .env}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:?Set SHUTDOWN_TIMEOUT in root .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:${OTLP_HTTP_PORT:?Set OTLP_HTTP_PORT in root .env}
      AGGREGATOR_POLL_ENABLED: ${AGGREGATOR_POLL_ENABLED:?Set AGGREGATOR_POLL_ENABLED in root .env}
      AGGREGATOR_REPLAY_ENABLED: ${AGGREGATOR_REPLAY_ENABLED:?Set AGGREGATOR_REPLAY_ENABLED in root .env}
      AGGREGATOR_PUBLISH_ENABLED: ${AGGREGATOR_PUBLISH_ENABLED:?Set AGGREGATOR_PUBLISH_ENABLED in root .env}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:?Set DB_STATEMENT_TIMEOUT in root .env}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:?Set DB_LOCK_TIMEOUT in root .env}
    healthcheck:
      test:
